<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HealAI — Coming soon</title>
  <meta name="description" content="HealAI: connecting the foundations of lifelong health. Coming soon." />
  <meta name="theme-color" content="#112945" />
  <link rel="icon" href="logo.png" />
  <style>
    :root {
      --navy: #112945;
      --sky: #7cc4ef;
      --ink: #1f2937;
      --muted: #5b6676;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 85% -10%, rgba(124, 196, 239, 0.28), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(17, 41, 69, 0.10), transparent 60%),
        #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main { width: 100%; max-width: 620px; text-align: center; }
    .logo { width: min(320px, 80vw); height: auto; display: block; margin: 0 auto 40px; }
    .badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 16px;
      color: var(--navy);
      font-size: clamp(26px, 5.5vw, 40px);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    p { margin: 0 auto; max-width: 480px; color: var(--muted); font-size: 17px; line-height: 1.6; }
    .bar {
      width: 64px; height: 4px; border-radius: 4px;
      background: linear-gradient(90deg, var(--sky), var(--navy));
      margin: 32px auto 0;
    }
    footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="HealAI — Connecting the foundations of lifelong health." width="638" height="201" />
    <span class="badge">Coming soon</span>
    <h1>A smarter clinic is on its way.</h1>
    <p>HealAI brings patient intake, posture analysis and clinical records together, so clinicians can spend more time with their patients.</p>
    <div class="bar" aria-hidden="true"></div>
    <footer>&copy; <span id="year">2026</span> HealAI</footer>
  </main>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
